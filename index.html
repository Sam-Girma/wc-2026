<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup Bracket Predictor</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;%E2%9A%BD&lt;/text&gt;&lt;/svg&gt;" />
<style>
  :root {
    --bg: #0b1020;
    --panel: #151c33;
    --panel-2: #1d2745;
    --line: #2a3658;
    --text: #e7ecf7;
    --muted: #8b97b8;
    --win: #1f9d57;
    --win-glow: rgba(31, 157, 87, 0.55);
    --accent: #f5c542;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 50% 49%, rgba(245,197,66,.22), rgba(245,160,40,.06) 20%, transparent 44%),
      radial-gradient(circle at 50% 50%, #16110c 0%, #0c0a0e 48%, #070608 100%);
    background-color: #070608;
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  header {
    padding: 12px 20px 4px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button.reset {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all .15s;
  }
  button.reset:hover { background: #283354; border-color: var(--accent); }

  .stage {
    --size: min(96vw, 86vh, 980px);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin: 0 auto;
  }
  .links { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .links path {
    fill: none;
    stroke: rgba(245,197,66,.24);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .links path.on { stroke: var(--accent); stroke-width: 1.8; }

  .badge {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--size) * 0.004);
  }
  .badge .disc {
    border-radius: 50%;
    background: rgba(18,25,46,.92);
    border: 2px solid rgba(255,255,255,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    overflow: hidden;
    box-shadow: 0 2px 9px rgba(0,0,0,.55);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s, box-shadow .12s, filter .2s, opacity .2s;
  }
  .badge .disc.flag { background-size: cover; background-position: center; }
  .badge .disc:hover { transform: scale(1.1); border-color: var(--accent); }
  .rim-code {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 2;
    white-space: nowrap;
    font-weight: 800;
    color: var(--text);
    letter-spacing: .3px;
    text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9);
    font-size: calc(var(--size) * 0.0145);
    pointer-events: none;
  }
  .rim-code.elim { opacity: .32; }

  .lvl0 .disc { width: calc(var(--size)*0.063); height: calc(var(--size)*0.063); }
  .lvl1 .disc { width: calc(var(--size)*0.06);  height: calc(var(--size)*0.06);  }
  .lvl2 .disc { width: calc(var(--size)*0.058); height: calc(var(--size)*0.058); }
  .lvl3 .disc { width: calc(var(--size)*0.056); height: calc(var(--size)*0.056); }
  .lvl4 .disc { width: calc(var(--size)*0.058); height: calc(var(--size)*0.058); }

  .badge.placeholder .disc { background: rgba(255,255,255,.03); border-style: dashed; cursor: default; }
  .badge.placeholder .disc:hover { transform: none; border-color: var(--line); }
  .badge.elim .disc { filter: grayscale(1); opacity: .28; }
  .badge.elim .code { opacity: .3; }
  .badge.win .disc {
    border-color: var(--win);
    box-shadow: 0 0 0 2px var(--win-glow), 0 2px 12px rgba(0,0,0,.5);
  }
  .badge.win .code { color: #bdf6d4; }

  .fly {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 6;
    pointer-events: none;
    width: calc(var(--size) * 0.06);
    height: calc(var(--size) * 0.06);
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 2px rgba(245,197,66,.3), 0 3px 10px rgba(0,0,0,.6);
    transition: left .55s cubic-bezier(.45,.02,.2,1),
                top .55s cubic-bezier(.45,.02,.2,1),
                opacity .55s ease-in;
  }

  .center {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3; text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
  }
  .center .trophy {
    height: calc(var(--size) * 0.2);
    width: auto;
    display: block;
    filter: drop-shadow(0 0 14px rgba(245,197,66,.55)) drop-shadow(0 4px 10px rgba(0,0,0,.5));
  }
  .center .champ-flag {
    width: calc(var(--size) * 0.052);
    height: calc(var(--size) * 0.052);
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 2px solid var(--accent);
    box-shadow: 0 0 10px rgba(245,197,66,.5);
    margin-top: calc(var(--size) * 0.008);
  }
  .center .champ-name {
    font-weight: 800;
    font-size: calc(var(--size) * 0.024);
    color: var(--accent);
    letter-spacing: .3px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .center .champ-label {
    font-size: calc(var(--size) * 0.013);
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .hint { color: var(--muted); font-size: 11px; text-align: center; padding: 8px 18px 0; margin: 0; }
  .made { text-align: center; color: var(--muted); font-size: 11px; padding: 6px 0 10px; margin: 0; }
  .made .heart { color: #ff5a7a; }
  .made a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .made a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    header { padding: 10px 14px 2px; gap: 8px; }
    header h1 { font-size: 15px; }
    header p { display: none; }
    button.reset { padding: 7px 12px; font-size: 12px; }
    .stage { --size: min(92vw, 62vh, 480px); }
    .hint { font-size: 10px; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>⚽ World Cup Bracket Predictor</h1>
      <p>Click a team to advance it toward the trophy. Eliminated teams fade out.</p>
    </div>
    <div class="spacer"></div>
    <button class="reset" id="resetBtn">Reset all picks</button>
  </header>

  <main class="main">
    <div class="stage" id="stage"></div>
    <p class="hint">Tap a country to send it to the next ring. Click a faded team to switch the winner; this clears any later picks that depended on it.</p>
  </main>
  <footer class="made">Made with <span class="heart">&#10084;</span> by Samuel &middot; <a href="https://x.com/samiawsome1" target="_blank" rel="noreferrer">@samiawsome1</a></footer>

<script>
  const FLAGS = {
    "South Africa":"🇿🇦","Canada":"🇨🇦","Netherlands":"🇳🇱","Morocco":"🇲🇦",
    "Germany":"🇩🇪","Paraguay":"🇵🇾","France":"🇫🇷","Sweden":"🇸🇪",
    "Belgium":"🇧🇪","Senegal":"🇸🇳","USA":"🇺🇸","Bosnia and Herzegovina":"🇧🇦",
    "Spain":"🇪🇸","Austria":"🇦🇹","Portugal":"🇵🇹","Croatia":"🇭🇷",
    "Brazil":"🇧🇷","Japan":"🇯🇵","Côte d'Ivoire":"🇨🇮","Norway":"🇳🇴",
    "Mexico":"🇲🇽","Ecuador":"🇪🇨","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","DR Congo":"🇨🇩",
    "Switzerland":"🇨🇭","Algeria":"🇩🇿","Colombia":"🇨🇴","Ghana":"🇬🇭",
    "Australia":"🇦🇺","Egypt":"🇪🇬","Argentina":"🇦🇷","Cabo Verde":"🇨🇻"
  };

  const SHORT = {
    "South Africa":"RSA","Canada":"CAN","Netherlands":"NED","Morocco":"MAR",
    "Germany":"GER","Paraguay":"PAR","France":"FRA","Sweden":"SWE",
    "Belgium":"BEL","Senegal":"SEN","USA":"USA","Bosnia and Herzegovina":"BIH",
    "Spain":"ESP","Austria":"AUT","Portugal":"POR","Croatia":"CRO",
    "Brazil":"BRA","Japan":"JPN","Côte d'Ivoire":"CIV","Norway":"NOR",
    "Mexico":"MEX","Ecuador":"ECU","England":"ENG","DR Congo":"COD",
    "Switzerland":"SUI","Algeria":"ALG","Colombia":"COL","Ghana":"GHA",
    "Australia":"AUS","Egypt":"EGY","Argentina":"ARG","Cabo Verde":"CPV"
  };

  // Round of 32 matchups (top team listed first).
  const round32 = [
    ["South Africa", "Canada"],
    ["Netherlands", "Morocco"],
    ["Germany", "Paraguay"],
    ["France", "Sweden"],
    ["Belgium", "Senegal"],
    ["USA", "Bosnia and Herzegovina"],
    ["Spain", "Austria"],
    ["Portugal", "Croatia"],
    ["Brazil", "Japan"],
    ["Côte d'Ivoire", "Norway"],
    ["Mexico", "Ecuador"],
    ["England", "DR Congo"],
    ["Switzerland", "Algeria"],
    ["Colombia", "Ghana"],
    ["Australia", "Egypt"],
    ["Argentina", "Cabo Verde"]
  ];

  const ROUND_COUNT = 5;            // R32, R16, QF, SF, Final
  const COUNTS = [32, 16, 8, 4, 2, 1]; // nodes per ring (level 0..5, last = champion)
  const RADII  = [0.88, 0.655, 0.46, 0.295, 0.15, 0]; // fraction of half-stage
  const SPREAD = 44;                // percent of stage from centre at radius 1

  // picks[round][match] = winning team (or null). round 0 -> 16 winners ... round 4 -> 1.
  const picks = [];
  let c = 16;
  for (let r = 0; r < ROUND_COUNT; r++) { picks.push(new Array(c).fill(null)); c /= 2; }

  // The team occupying a given ring slot (null if not decided yet).
  function teamAt(level, slot) {
    if (level === 0) return round32[Math.floor(slot / 2)][slot % 2];
    return picks[level - 1][slot];
  }

  function clearDownstream(round, idx) {
    if (round + 1 >= ROUND_COUNT) return;
    const next = Math.floor(idx / 2);
    if (picks[round + 1][next] !== null) {
      picks[round + 1][next] = null;
      clearDownstream(round + 1, next);
    }
  }

  function choose(round, idx, team) {
    if (!team) return;
    if (picks[round][idx] === team) picks[round][idx] = null; // toggle off
    else picks[round][idx] = team;
    clearDownstream(round, idx);
    render();
  }

  // Send a flag gliding along the connecting line into the next ring.
  function flyFlag(from, to, team) {
    const stage = document.getElementById("stage");
    const f = document.createElement("div");
    f.className = "fly";
    f.style.backgroundImage = "url('" + flagUrl(team) + "')";
    f.style.left = from.x + "%";
    f.style.top = from.y + "%";
    stage.appendChild(f);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      f.style.left = to.x + "%";
      f.style.top = to.y + "%";
      f.style.opacity = "0";
    }));
    f.addEventListener("transitionend", () => f.remove(), { once: true });
    setTimeout(() => f.remove(), 1000);
  }

  function advance(level, slot, team) {
    const idx = Math.floor(slot / 2);
    const undo = picks[level][idx] === team;
    const from = nodePos(level, slot);
    const to = nodePos(level + 1, idx);
    choose(level, idx, team);           // update state + re-render
    if (!undo) flyFlag(from, to, team); // glide overlay onto the new ring
  }

  // Set of teams that have lost a decided match (greyed out).
  function eliminatedTeams() {
    const elim = new Set();
    for (let p = 0; p < 32; p++) {
      const team = round32[Math.floor(p / 2)][p % 2];
      for (let r = 0; r < ROUND_COUNT; r++) {
        const w = picks[r][Math.floor(p / Math.pow(2, r + 1))];
        if (w === null) break;            // undecided -> still alive
        if (w !== team) { elim.add(team); break; }
      }
    }
    return elim;
  }

  function angleDeg(level, slot) { return -90 + (slot + 0.5) * (360 / COUNTS[level]); }
  function polar(rPct, deg) {
    const a = deg * Math.PI / 180;
    return { x: 50 + rPct * Math.cos(a), y: 50 + rPct * Math.sin(a) };
  }
  function nodePos(level, slot) { return polar(RADII[level] * SPREAD, angleDeg(level, slot)); }

  const ISO = {
    "South Africa":"za","Canada":"ca","Netherlands":"nl","Morocco":"ma",
    "Germany":"de","Paraguay":"py","France":"fr","Sweden":"se",
    "Belgium":"be","Senegal":"sn","USA":"us","Bosnia and Herzegovina":"ba",
    "Spain":"es","Austria":"at","Portugal":"pt","Croatia":"hr",
    "Brazil":"br","Japan":"jp","Côte d'Ivoire":"ci","Norway":"no",
    "Mexico":"mx","Ecuador":"ec","England":"gb-eng","DR Congo":"cd",
    "Switzerland":"ch","Algeria":"dz","Colombia":"co","Ghana":"gh",
    "Australia":"au","Egypt":"eg","Argentina":"ar","Cabo Verde":"cv"
  };
  function flagUrl(team) { return "https://flagcdn.com/w160/" + ISO[team] + ".png"; }

  function render() {
    const stage = document.getElementById("stage");
    stage.innerHTML = "";

    // 1) bracket connectors: a radial spoke from each team to its match's
    //    radius, then an arc crossbar to the parent slot (right-angled bracket).
    let svg = '<svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none">';
    for (let L = 1; L <= ROUND_COUNT; L++) {
      const rPar = RADII[L] * SPREAD;
      for (let s = 0; s < COUNTS[L]; s++) {
        const tp = angleDeg(L, s);
        const par = polar(rPar, tp);
        const winner = picks[L - 1][s];
        for (const cs of [2 * s, 2 * s + 1]) {
          const tc = angleDeg(L - 1, cs);
          const childPt = nodePos(L - 1, cs);
          const inner = polar(rPar, tc);
          const sweep = tc < tp ? 1 : 0;
          const d = `M ${childPt.x.toFixed(2)} ${childPt.y.toFixed(2)} ` +
                    `L ${inner.x.toFixed(2)} ${inner.y.toFixed(2)} ` +
                    `A ${rPar.toFixed(2)} ${rPar.toFixed(2)} 0 0 ${sweep} ${par.x.toFixed(2)} ${par.y.toFixed(2)}`;
          const on = winner && teamAt(L - 1, cs) === winner ? ' class="on"' : '';
          svg += `<path${on} d="${d}" />`;
        }
      }
    }
    svg += "</svg>";
    stage.insertAdjacentHTML("beforeend", svg);

    // 2) team discs for rings 0..4
    const elim = eliminatedTeams();
    for (let L = 0; L < ROUND_COUNT; L++) {
      for (let s = 0; s < COUNTS[L]; s++) {
        const team = teamAt(L, s);
        const pos = nodePos(L, s);
        const badge = document.createElement("div");
        badge.className = "badge lvl" + L;
        badge.style.left = pos.x + "%";
        badge.style.top = pos.y + "%";

        const disc = document.createElement("div");
        disc.className = "disc";

        if (team) {
          disc.classList.add("flag");
          disc.style.backgroundImage = "url('" + flagUrl(team) + "')";
          badge.title = team;
          if (elim.has(team)) badge.classList.add("elim");
          if (picks[L][Math.floor(s / 2)] === team) badge.classList.add("win");
          disc.addEventListener("click", () => advance(L, s, team));
          badge.appendChild(disc);
        } else {
          badge.classList.add("placeholder");
          badge.appendChild(disc);
        }
        stage.appendChild(badge);
      }
    }

    // 2b) country codes just outside the outer ring, placed radially so they
    //     point straight out and never land on a disc or an inner ring.
    for (let s = 0; s < COUNTS[0]; s++) {
      const team = teamAt(0, s);
      if (!team) continue;
      const ang = (-90 + (s + 0.5) * (360 / COUNTS[0])) * Math.PI / 180;
      const r = 44;
      const lbl = document.createElement("div");
      lbl.className = "rim-code" + (elim.has(team) ? " elim" : "");
      lbl.textContent = SHORT[team] || team;
      lbl.style.left = (50 + r * Math.cos(ang)) + "%";
      lbl.style.top = (50 + r * Math.sin(ang)) + "%";
      stage.appendChild(lbl);
    }

    // 3) centre trophy / champion
    const champ = picks[ROUND_COUNT - 1][0];
    const center = document.createElement("div");
    center.className = "center";
    center.innerHTML = '<img class="trophy" src="trophy.png" alt="World Cup trophy" />' +
      (champ
        ? '<div class="champ-flag" style="background-image:url(\'' + flagUrl(champ) + '\')"></div>' +
          '<div class="champ-name">' + champ + '</div>'
        : '<div class="champ-label">Champion</div>');
    stage.appendChild(center);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    for (let r = 0; r < ROUND_COUNT; r++) picks[r].fill(null);
    render();
  });

  render();
</script>
</body>
</html>
